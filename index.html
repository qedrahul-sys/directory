<!DOCTYPE html>
<html lang="hi" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Directory & Notes</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }

        /* ---------- Smooth animations ---------- */
        @keyframes fadeIn  { from { opacity: 0 } to { opacity: 1 } }
        @keyframes fadeOut { from { opacity: 1 } to { opacity: 0 } }
        @keyframes popIn {
            0%   { opacity: 0; transform: scale(.90) translateY(14px); }
            60%  { opacity: 1; transform: scale(1.015) translateY(0); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }
        @keyframes popOut {
            0%   { opacity: 1; transform: scale(1) translateY(0); }
            100% { opacity: 0; transform: scale(.94) translateY(10px); }
        }
        @keyframes rowIn {
            from { opacity: 0; transform: translateY(10px) scale(.985); }
            to   { opacity: 1; transform: translateY(0) scale(1); }
        }
        @keyframes popAvatar {
            0% { transform: scale(.6); } 70% { transform: scale(1.08); } 100% { transform: scale(1); }
        }
        @keyframes spinOnce { to { transform: rotate(360deg); } }

        .modal-backdrop { animation: fadeIn .22s ease-out both; }
        .modal-backdrop.closing { animation: fadeOut .19s ease-in both; }

        .pop-card { animation: popIn .34s cubic-bezier(.16, 1, .3, 1) both; will-change: transform, opacity; }
        .pop-card.closing { animation: popOut .19s cubic-bezier(.4, 0, 1, 1) both; }

        .fade-pop { animation: fadeIn .35s ease-out both; }

        .list-row { animation: rowIn .3s cubic-bezier(.16, 1, .3, 1) both; }
        .list-row:hover { transform: translateY(-2px); box-shadow: 0 8px 18px -8px rgba(79, 70, 229, .35); }
        .list-row:active { transform: scale(.985); }
        .list-row, .list-row * { transition: background-color .18s ease, border-color .18s ease,
                                 box-shadow .2s ease, transform .18s cubic-bezier(.16,1,.3,1), color .18s ease; }

        .avatar-pop { animation: popAvatar .45s cubic-bezier(.16, 1, .3, 1) both; }

        .btn-press { transition: transform .16s cubic-bezier(.16,1,.3,1), box-shadow .18s ease,
                                 background-color .18s ease, color .18s ease, opacity .18s ease; }
        .btn-press:hover { transform: translateY(-1.5px); box-shadow: 0 8px 16px -10px rgba(15, 23, 42, .5); }
        .btn-press:active { transform: scale(.955); }
        .btn-press:disabled { opacity: .7; cursor: not-allowed; transform: none; }

        .empty-pop { animation: fadeIn .35s ease-out both; }
        .spinner { animation: spinOnce .8s linear infinite; }

        @media (prefers-reduced-motion: reduce) {
            * { animation-duration: .001s !important; transition-duration: .001s !important; }
        }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-50 to-indigo-50 text-slate-800 h-full flex flex-col">

    <!-- Login Screen -->
    <div id="loginScreen" class="modal-backdrop fixed inset-0 z-50 bg-gradient-to-br from-slate-50 to-indigo-50 hidden items-center justify-center p-4">
        <div class="pop-card bg-white rounded-2xl shadow-xl border border-slate-200 p-8 w-full max-w-sm text-center">
            <div class="bg-indigo-600 text-white w-14 h-14 rounded-2xl shadow-md flex items-center justify-center mx-auto mb-4 avatar-pop">
                <i class="fa-solid fa-address-book text-2xl"></i>
            </div>
            <h1 class="text-xl font-bold text-slate-900">Smart Directory</h1>
            <p class="text-sm text-slate-500 mt-1 mb-6">Apne contacts aur notes dekhne ke liye login karein</p>
            <button id="loginBtn" class="btn-press w-full flex items-center justify-center gap-3 bg-white border border-slate-300 hover:bg-slate-50 text-slate-700 py-3 px-4 rounded-xl font-medium text-sm shadow-sm transition">
                <i id="loginIcon" class="fa-brands fa-google text-rose-500"></i>
                <i id="loginSpinner" class="fa-solid fa-circle-notch spinner hidden text-indigo-600"></i>
                <span id="loginBtnText">Google se Login karein</span>
            </button>
            <p id="loginError" class="text-xs text-rose-600 mt-4 hidden leading-relaxed"></p>
        </div>
    </div>

    <!-- Header -->
    <header class="bg-white shadow-sm border-b border-slate-200 sticky top-0 z-20">
        <div class="max-w-6xl mx-auto px-4 py-4 flex flex-col sm:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-3">
                <div class="bg-indigo-600 text-white p-2.5 rounded-xl shadow-md">
                    <i class="fa-solid fa-address-book text-xl"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold text-slate-900">Smart Directory</h1>
                    <p class="text-xs text-slate-500">Call, WhatsApp & Notes ek hi jagah par</p>
                </div>
            </div>
            <div class="flex items-center gap-3 w-full sm:w-auto">
                <div class="relative flex-1 sm:w-64">
                    <span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
                        <i class="fa-solid fa-search"></i>
                    </span>
                    <input type="text" id="searchInput" placeholder="Search contacts..."
                        class="w-full pl-10 pr-4 py-2 border border-slate-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-slate-50 transition-all duration-200 focus:bg-white focus:shadow-md">
                </div>
                <button onclick="openAddModal()" class="btn-press bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-xl text-sm font-medium shadow-sm transition flex items-center gap-2 whitespace-nowrap">
                    <i class="fa-solid fa-user-plus"></i> Naya Contact
                </button>
                <div id="userChip" class="hidden items-center gap-2 pl-2 pr-1 py-1 bg-slate-100 rounded-xl">
                    <img id="userPhoto" alt="" class="w-7 h-7 rounded-lg object-cover hidden">
                    <span id="userName" class="hidden sm:inline text-xs font-medium text-slate-600 max-w-[90px] truncate"></span>
                    <button onclick="logout()" title="Logout" class="btn-press p-1.5 hover:bg-slate-200 text-slate-500 rounded-lg transition text-xs">
                        <i class="fa-solid fa-right-from-bracket"></i>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- Main -->
    <main class="max-w-6xl mx-auto px-4 py-6 flex-1 w-full flex">

        <div class="w-full bg-white rounded-2xl shadow-sm border border-slate-200 p-4 flex flex-col h-[calc(100vh-180px)]">
            <div class="flex justify-between items-center mb-4">
                <h2 class="font-semibold text-slate-700 flex items-center gap-2">
                    <i class="fa-solid fa-users text-indigo-600"></i> Contacts
                    <span id="contactCount" class="bg-indigo-100 text-indigo-700 text-xs px-2 py-0.5 rounded-full font-bold">0</span>
                </h2>
                <span id="syncStatus" class="text-[10px] text-slate-400"></span>
            </div>
            <div id="contactsList" class="overflow-y-auto flex-1 space-y-2 pr-1"></div>
        </div>

        <!-- Detail popup: contact select karne par center me khulta hai -->
        <div id="detailModal" class="modal-backdrop fixed inset-0 z-40 bg-slate-900/50 backdrop-blur-sm hidden items-center justify-center p-4 sm:p-6" onclick="if (event.target === this) closeDetail()">
            <div id="detailPanel" data-modal-card class="pop-card bg-white rounded-2xl shadow-2xl border border-slate-200 w-full max-w-lg max-h-[90vh] overflow-y-auto p-6 flex flex-col">

                <div class="flex items-start justify-between border-b border-slate-100 pb-4">
                    <div class="flex items-center gap-4">
                        <div id="detailAvatar" class="avatar-pop w-14 h-14 bg-indigo-100 text-indigo-600 rounded-2xl flex items-center justify-center font-bold text-xl shadow-sm">A</div>
                        <div>
                            <h2 id="detailName" class="text-xl font-bold text-slate-900">Name</h2>
                            <p id="detailPhone" class="text-sm text-slate-500 font-medium mt-0.5">+91 00000 00000</p>
                            <span id="detailCategory" class="inline-block mt-1 text-xs px-2 py-0.5 bg-slate-100 text-slate-600 rounded-md font-medium">General</span>
                        </div>
                    </div>
                    <div class="flex items-center gap-2">
                        <button onclick="editCurrentContact()" class="btn-press p-2.5 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded-xl transition text-sm" title="Edit Contact">
                            <i class="fa-solid fa-pen"></i>
                        </button>
                        <button onclick="deleteCurrentContact()" class="btn-press p-2.5 bg-rose-50 hover:bg-rose-100 text-rose-600 rounded-xl transition text-sm" title="Delete Contact">
                            <i class="fa-solid fa-trash"></i>
                        </button>
                        <button onclick="closeDetail()" class="btn-press p-2.5 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded-xl transition text-sm" title="Band karein">
                            <i class="fa-solid fa-xmark text-lg"></i>
                        </button>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-4 my-6">
                    <a id="callBtn" href="#" class="btn-press flex items-center justify-center gap-2 bg-emerald-600 hover:bg-emerald-700 text-white py-3 px-4 rounded-xl font-medium shadow-sm transition text-sm">
                        <i class="fa-solid fa-phone"></i> Call
                    </a>
                    <a id="whatsappBtn" href="#" target="_blank" rel="noopener" class="btn-press flex items-center justify-center gap-2 bg-green-500 hover:bg-green-600 text-white py-3 px-4 rounded-xl font-medium shadow-sm transition text-sm">
                        <i class="fa-brands fa-whatsapp text-lg"></i> WhatsApp
                    </a>
                </div>

                <div class="flex flex-col mt-2">
                    <div class="flex justify-between items-center mb-2">
                        <label class="text-xs font-bold text-slate-600 uppercase tracking-wider flex items-center gap-1.5">
                            <i class="fa-solid fa-note-sticky text-indigo-600"></i> Personal Notes &amp; Reminders
                        </label>
                        <span id="saveStatus" class="text-xs text-emerald-600 font-medium opacity-0 transition-opacity">Saved to cloud</span>
                    </div>
                    <textarea id="contactNotes" placeholder="Yahan is contact ke baare mein notes likhein..."
                        class="w-full min-h-[180px] p-4 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-slate-50 resize-none leading-relaxed transition-all duration-200 focus:bg-white"
                        oninput="triggerAutoSave()"></textarea>
                </div>
            </div>
        </div>
    </main>

    <!-- Add/Edit Modal -->
    <div id="contactModal" class="modal-backdrop fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4" onclick="if (event.target === this) closeModal()">
        <div data-modal-card class="pop-card bg-white rounded-2xl shadow-2xl w-full max-w-md overflow-hidden">
            <div class="px-6 py-4 border-b border-slate-100 flex justify-between items-center bg-slate-50">
                <h3 id="modalTitle" class="font-bold text-slate-800">Naya Contact Jodein</h3>
                <button onclick="closeModal()" class="btn-press text-slate-400 hover:text-slate-600 text-sm p-1 rounded-lg">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>
            <form id="contactForm" onsubmit="saveContact(event)" class="p-6 space-y-4">
                <input type="hidden" id="contactId">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1">Pura Naam</label>
                    <input type="text" id="nameInput" required placeholder="Jaise: Rahul Sharma"
                        class="w-full px-4 py-2 border border-slate-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-all duration-200">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1">Mobile Number</label>
                    <input type="tel" id="phoneInput" required placeholder="Jaise: 9876543210"
                        class="w-full px-4 py-2 border border-slate-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-all duration-200">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1">Category</label>
                    <input type="text" id="categoryInput" placeholder="Jaise: Family, Office, Client, etc."
                        class="w-full px-4 py-2 border border-slate-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-white transition-all duration-200">
                </div>
                <div class="pt-3 flex gap-3">
                    <button type="button" onclick="closeModal()" class="btn-press flex-1 bg-slate-100 hover:bg-slate-200 text-slate-700 py-2.5 rounded-xl font-medium text-sm transition">Cancel</button>
                    <button type="submit" id="saveBtn" class="btn-press flex-1 bg-indigo-600 hover:bg-indigo-700 text-white py-2.5 rounded-xl font-medium text-sm shadow-sm transition">Save Contact</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Toast -->
    <div id="toast" class="fixed bottom-6 right-6 bg-slate-900 text-white px-4 py-3 rounded-xl shadow-lg transform translate-y-20 scale-90 opacity-0 transition-all duration-300 ease-out z-[60] text-sm flex items-center gap-2">
        <i class="fa-solid fa-circle-check text-emerald-400"></i>
        <span id="toastMessage">Success message</span>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, signInWithRedirect, getRedirectResult, signOut, onAuthStateChanged }
            from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
        import { initializeFirestore, persistentLocalCache, persistentMultipleTabManager,
                 collection, doc, setDoc, updateDoc, deleteDoc, onSnapshot, query, orderBy, getDocs }
            from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAUzRWsF6hcPnvbHaEXZCyvf4U33jG7Mwg",
            authDomain: "directory-980cf.firebaseapp.com",
            projectId: "directory-980cf",
            storageBucket: "directory-980cf.firebasestorage.app",
            messagingSenderId: "76511470276",
            appId: "1:76511470276:web:b18d0192cbecfd6d5b9f91"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        auth.useDeviceLanguage();
        // Offline cache: bina internet ke bhi data dikhega, net aate hi sync ho jayega
        const db = initializeFirestore(app, {
            localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() })
        });

        let contacts = [];
        let activeContactId = null;
        let saveTimeout = null;
        let unsubscribe = null;
        let currentUser = null;
        let firstSnapshot = true;

        const $ = (id) => document.getElementById(id);
        const esc = (s) => String(s ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
        const contactsCol = () => collection(db, 'users', currentUser.uid, 'contacts');

        // ---------- Smooth modal helpers ----------
        function openModal(el) {
            el.classList.remove('hidden', 'closing');
            el.classList.add('flex');
            const card = el.querySelector('[data-modal-card]');
            if (card) { card.classList.remove('closing'); void card.offsetWidth; }
        }
        function closeModalEl(el, done) {
            if (!el || el.classList.contains('hidden')) { if (done) done(); return; }
            el.classList.add('closing');
            const card = el.querySelector('[data-modal-card]');
            if (card) card.classList.add('closing');
            setTimeout(() => {
                el.classList.add('hidden');
                el.classList.remove('flex', 'closing');
                if (card) card.classList.remove('closing');
                if (done) done();
            }, 195);
        }

        function showToast(message) {
            const toast = $('toast');
            $('toastMessage').innerText = message;
            toast.classList.remove('translate-y-20', 'opacity-0', 'scale-90');
            clearTimeout(showToast._t);
            showToast._t = setTimeout(() => toast.classList.add('translate-y-20', 'opacity-0', 'scale-90'), 2800);
        }

        // ---------- Auth ----------
        function friendlyAuthError(err) {
            const code = err && err.code ? err.code : '';
            if (code === 'auth/popup-closed-by-user' || code === 'auth/cancelled-popup-request') {
                return 'Login window band ho gaya. Dobara "Google se Login karein" par click karein.';
            }
            if (code === 'auth/unauthorized-domain') {
                return 'Yeh domain Google login ke liye authorized nahi hai. Firebase Console → Authentication → Settings → Authorized domains me yeh domain add karein.';
            }
            if (code === 'auth/operation-not-allowed') {
                return 'Google sign-in provider enable nahi hai. Firebase Console → Authentication → Sign-in method me Google enable karein.';
            }
            if (code === 'auth/blocked-by-browser' || code === 'auth/popup-blocked') {
                return 'Browser ne popup block kiya. Popup allow karein (ya Chrome me kholen) aur dobara try karein.';
            }
            if (code === 'auth/network-request-failed') {
                return 'Internet connection ka problem lagta hai. Net check karke dobara try karein.';
            }
            if (code === 'auth/invalid-api-key' || code === 'auth/api-key-not-valid.-please-pass-a-valid-api-key.') {
                return 'Firebase API key galat hai ya API key par restriction lagi hai. Console → Project settings se key check karein.';
            }
            return 'Login nahi ho paya: ' + (code || (err && err.message) || 'unknown error');
        }

        async function doLogin() {
            const btn = $('loginBtn');
            const err = $('loginError');
            err.classList.add('hidden');
            btn.disabled = true;
            $('loginIcon').classList.add('hidden');
            $('loginSpinner').classList.remove('hidden');
            $('loginBtnText').innerText = 'Login ho raha hai...';

            try {
                await signInWithPopup(auth, new GoogleAuthProvider());
            } catch (e) {
                const code = e && e.code ? e.code : '';
                // Popup block / unsupported environment -> redirect fallback
                if (code === 'auth/popup-blocked' || code === 'auth/operation-not-supported-in-this-environment' || code === 'auth/web-storage-unsupported') {
                    try { await signInWithRedirect(auth, new GoogleAuthProvider()); return; } catch (e2) { e = e2; }
                }
                err.textContent = friendlyAuthError(e);
                err.classList.remove('hidden');
            } finally {
                btn.disabled = false;
                $('loginSpinner').classList.add('hidden');
                $('loginIcon').classList.remove('hidden');
                $('loginBtnText').innerText = 'Google se Login karein';
            }
        }

        $('loginBtn').addEventListener('click', doLogin);

        window.logout = async () => {
            try { await signOut(auth); showToast('Logout ho gaya.'); }
            catch (e) { showToast('Logout fail: ' + (e.code || e.message)); }
        };

        // Redirect login ke baad error dikhana
        getRedirectResult(auth).catch((e) => {
            $('loginError').textContent = friendlyAuthError(e);
            $('loginError').classList.remove('hidden');
        });

        onAuthStateChanged(auth, (user) => {
            if (unsubscribe) { unsubscribe(); unsubscribe = null; }
            if (user) {
                currentUser = user;
                firstSnapshot = true;
                $('loginScreen').classList.add('hidden');
                $('loginScreen').classList.remove('flex');
                $('userChip').classList.remove('hidden');
                $('userChip').classList.add('flex');
                if (user.displayName) {
                    $('userName').innerText = user.displayName.split(' ')[0];
                    $('userName').classList.remove('hidden');
                }
                if (user.photoURL) {
                    $('userPhoto').src = user.photoURL;
                    $('userPhoto').classList.remove('hidden');
                }
                startListening();
            } else {
                currentUser = null;
                contacts = [];
                activeContactId = null;
                if (unsubscribe) { unsubscribe(); unsubscribe = null; }
                $('contactCount').innerText = '0';
                $('contactsList').innerHTML = `<div class="empty-pop text-center py-8 text-slate-400 text-sm">Login karke apne contacts dekhein</div>`;
                $('userChip').classList.add('hidden');
                $('userChip').classList.remove('flex');
                $('syncStatus').textContent = '';
                closeModalEl($('detailModal'));
                openModal($('loginScreen'));
            }
        });

        // ---------- Live sync ----------
        function startListening() {
            const q = query(contactsCol(), orderBy('createdAt', 'desc'));
            unsubscribe = onSnapshot(q, async (snap) => {
                if (firstSnapshot) {
                    firstSnapshot = false;
                    if (snap.empty) { await migrateLocalData(); }
                }
                contacts = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                $('syncStatus').textContent = snap.metadata.hasPendingWrites ? 'Syncing...' : 'Synced';

                renderContacts($('searchInput').value);
                const active = contacts.find(c => c.id === activeContactId);
                if (active) {
                    renderDetail(active, document.activeElement !== $('contactNotes'));
                } else if (activeContactId) {
                    closeModalEl($('detailModal'), () => { activeContactId = null; });
                }
            }, (err) => {
                console.error(err);
                const m = (err && err.code) || '';
                if (m === 'permission-denied') {
                    showToast('Firestore permission denied — security rules check karein.');
                } else {
                    showToast('Sync error: ' + (m || err.message));
                }
            });
        }

        // Purana localStorage data pehli baar cloud mein bhejna
        async function migrateLocalData() {
            const flag = 'sd_migrated_' + currentUser.uid;
            if (localStorage.getItem(flag)) return;
            try {
                const old = JSON.parse(localStorage.getItem('smart_directory_contacts') || '[]');
                const base = Date.now();
                for (let i = 0; i < old.length; i++) {
                    const c = old[i];
                    const ref = doc(contactsCol());
                    await setDoc(ref, {
                        name: c.name || '', phone: c.phone || '',
                        category: c.category || 'General', notes: c.notes || '',
                        createdAt: base + (old.length - i)
                    });
                }
                localStorage.setItem(flag, '1');
                if (old.length) showToast(old.length + ' purane contacts cloud mein save ho gaye');
            } catch (e) { console.error(e); }
        }

        // ---------- UI ----------
        function closeDetail() {
            closeModalEl($('detailModal'), () => {
                activeContactId = null;
                renderContacts($('searchInput').value);
            });
        }
        window.closeDetail = closeDetail;

        function renderContacts(filter = '') {
            const f = filter.toLowerCase();
            const filtered = contacts.filter(c =>
                (c.name || '').toLowerCase().includes(f) ||
                (c.phone || '').includes(filter) ||
                (c.category || '').toLowerCase().includes(f)
            );
            $('contactCount').innerText = filtered.length;

            if (filtered.length === 0) {
                $('contactsList').innerHTML = `<div class="empty-pop text-center py-8 text-slate-400 text-sm">${contacts.length === 0 ? 'Abhi koi contact nahi hai — "Naya Contact" se add karein.' : 'Koi contact nahi mila'}</div>`;
                return;
            }
            $('contactsList').innerHTML = filtered.map((c, i) => `
                <div onclick="selectContact('${c.id}')" style="animation-delay:${Math.min(i * 45, 360)}ms"
                    class="list-row p-3 rounded-xl cursor-pointer flex items-center justify-between border ${activeContactId === c.id ? 'bg-indigo-50 border-indigo-200 shadow-sm' : 'bg-white border-slate-100 hover:bg-slate-50'}">
                    <div class="flex items-center gap-3 overflow-hidden">
                        <div class="w-10 h-10 rounded-xl bg-indigo-100 text-indigo-600 font-semibold flex items-center justify-center shrink-0 text-sm">
                            ${esc((c.name || '?').charAt(0).toUpperCase())}
                        </div>
                        <div class="truncate">
                            <h4 class="font-semibold text-slate-800 text-sm truncate">${esc(c.name)}</h4>
                            <p class="text-xs text-slate-400 truncate">${esc(c.phone)}</p>
                        </div>
                    </div>
                    <span class="text-[10px] bg-slate-100 text-slate-600 px-2 py-0.5 rounded-md font-medium shrink-0">${esc(c.category || 'General')}</span>
                </div>
            `).join('');
        }

        // updateNotes=false: live update aane par typing ke beech notes overwrite na ho
        function renderDetail(contact, updateNotes) {
            $('detailAvatar').innerText = (contact.name || '?').charAt(0).toUpperCase();
            $('detailName').innerText = contact.name;
            $('detailPhone').innerText = contact.phone;
            $('detailCategory').innerText = contact.category || 'General';
            $('callBtn').href = `tel:${contact.phone}`;
            const cleanPhone = (contact.phone || '').replace(/[^0-9+]/g, '').replace(/^\+/, '');
            $('whatsappBtn').href = `https://wa.me/${cleanPhone}`;
            if (updateNotes || document.activeElement !== $('contactNotes')) {
                $('contactNotes').value = contact.notes || '';
            }
            // avatar pop dobara chalane ke liye
            const av = $('detailAvatar');
            av.classList.remove('avatar-pop'); void av.offsetWidth; av.classList.add('avatar-pop');
        }

        window.selectContact = (id) => {
            activeContactId = id;
            const contact = contacts.find(c => c.id === id);
            if (!contact) return;

            renderContacts($('searchInput').value);
            openModal($('detailModal'));
            renderDetail(contact, true);
        };

        // ---------- Notes auto-save (cloud) ----------
        window.triggerAutoSave = () => {
            if (!activeContactId || !currentUser) return;
            const notesText = $('contactNotes').value;
            const id = activeContactId;
            clearTimeout(saveTimeout);
            saveTimeout = setTimeout(async () => {
                try {
                    await updateDoc(doc(db, 'users', currentUser.uid, 'contacts', id), { notes: notesText });
                    const statusEl = $('saveStatus');
                    statusEl.classList.remove('opacity-0');
                    setTimeout(() => statusEl.classList.add('opacity-0'), 1500);
                } catch (e) { showToast('Notes save nahi hue: ' + (e.code || e.message)); }
            }, 600);
        };

        // ---------- Modal ----------
        window.openAddModal = () => {
            $('modalTitle').innerText = "Naya Contact Jodein";
            $('contactForm').reset();
            $('contactId').value = '';
            openModal($('contactModal'));
        };

        window.editCurrentContact = () => {
            const contact = contacts.find(c => c.id === activeContactId);
            if (!contact) return;
            $('modalTitle').innerText = "Contact Edit Karein";
            $('contactId').value = contact.id;
            $('nameInput').value = contact.name;
            $('phoneInput').value = contact.phone;
            $('categoryInput').value = contact.category || '';
            openModal($('contactModal'));
        };

        window.closeModal = () => closeModalEl($('contactModal'));

        window.saveContact = async (e) => {
            e.preventDefault();
            if (!currentUser) { showToast('Pehle login karein.'); return; }

            const id = $('contactId').value;
            const name = $('nameInput').value.trim();
            const phone = $('phoneInput').value.trim();
            const category = $('categoryInput').value.trim() || 'General';
            const saveBtn = $('saveBtn');
            saveBtn.disabled = true;
            saveBtn.innerText = 'Saving...';

            try {
                if (id) {
                    await updateDoc(doc(db, 'users', currentUser.uid, 'contacts', id), { name, phone, category });
                    showToast('Contact update ho gaya!');
                } else {
                    const ref = doc(contactsCol());
                    activeContactId = ref.id;
                    await setDoc(ref, { name, phone, category, notes: '', createdAt: Date.now() });
                    showToast('Naya contact jud gaya!');
                }
                closeModalEl($('contactModal'), () => {
                    renderContacts($('searchInput').value);
                    const active = contacts.find(c => c.id === activeContactId);
                    if (active) { openModal($('detailModal')); renderDetail(active, true); }
                });
            } catch (err) {
                console.error(err);
                showToast('Save nahi hua: ' + (err.code || err.message));
            } finally {
                saveBtn.disabled = false;
                saveBtn.innerText = 'Save Contact';
            }
        };

        window.deleteCurrentContact = async () => {
            if (!activeContactId || !currentUser) return;
            if (!confirm("Kya aap is contact ko delete karna chahte hain?")) return;
            const id = activeContactId;
            try {
                await deleteDoc(doc(db, 'users', currentUser.uid, 'contacts', id));
                closeModalEl($('detailModal'), () => {
                    activeContactId = null;
                    renderContacts($('searchInput').value);
                    showToast('Contact delete ho gaya.');
                });
            } catch (err) {
                console.error(err);
                showToast('Delete nahi hua: ' + (err.code || err.message));
            }
        };

        $('searchInput').addEventListener('input', (e) => renderContacts(e.target.value));

        // Escape se popup band
        document.addEventListener('keydown', (e) => {
            if (e.key !== 'Escape') return;
            if (!$('contactModal').classList.contains('hidden')) { closeModalEl($('contactModal')); return; }
            if (!$('detailModal').classList.contains('hidden')) closeDetail();
        });
    </script>
</body>
</html>
